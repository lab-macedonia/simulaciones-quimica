name: Verificación
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Comprobaciones estáticas (enlaces, sintaxis, ES/EN, guías)
        run: node tools/check.js
      - name: Instalar dependencias (jsdom y Chromium)
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prueba de humo de todas las simulaciones (ES y EN)
        run: node tools/run-smoke.js
